name: Daily picks

# Runs at 10:45am Sydney on Tuesday, Thursday and Sunday; HubSpot sends the email at 12:05pm.
# GitHub schedules are in UTC: 10:45am Sydney is 23:45 UTC the day before in daylight saving
# (so Mon/Wed/Sat UTC) and 00:45 UTC the same day otherwise. Both are scheduled; the one
# that doesn't match today's offset stops straight away.
on:
  schedule:
    - cron: "45 23 * * 1,3,6"
    - cron: "45 0 * * 0,2,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (write nothing), test (TEST_EMAILS only) or live (everyone)"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, test, live]
      test_as:
        description: "Test mode only: email of the buyer whose picks you want to receive (blank = most active buyer)"
        required: false
        default: ""

# Never run two at once: a second run waits for the first, so the no-repeat history is always up to date.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only run at 10:45am Sydney
        id: gate
        run: |
          # Sydney is UTC+11 in daylight saving and UTC+10 otherwise.
          # Pick the schedule that matches today's offset; this still works if GitHub starts the run late.
          if [ "$(TZ=Australia/Sydney date +%z)" = "+1100" ]; then want="45 23 * * 1,3,6"; else want="45 0 * * 0,2,4"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$want" ]; then
            echo "This schedule is for the other half of the year - skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Update HubSpot
        if: steps.gate.outputs.go == 'true'
        env:
          # Manual runs use the mode picked in the Run workflow box; scheduled runs use the
          # repo variable MODE (set it to test first, then live once signed off).
          MODE: ${{ github.event.inputs.mode || vars.MODE || 'dry-run' }}
          METABASE_URL: https://reporting.motorplatform.com.au
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          PICKS_QUESTION_ID: "270"
          ENDING_QUESTION_ID: ${{ vars.ENDING_QUESTION_ID }}
          TEMPLATE_PATH: ${{ vars.TEMPLATE_PATH || 'motormarket-daily-picks.html' }}
          TEST_EMAILS: ${{ vars.TEST_EMAILS }}
          TEST_AS: ${{ github.event.inputs.test_as }}
          COUNTDOWN_URL: ${{ vars.COUNTDOWN_URL }}
          MIN_BUYERS: "20"
        run: python daily_picks.py

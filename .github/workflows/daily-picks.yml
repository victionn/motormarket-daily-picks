name: Daily picks

# Runs at 9:05am Sydney on Tuesday, Thursday and Sunday; HubSpot sends the email at 12:05pm.
# GitHub schedules are in UTC: 9:05am Sydney is 22:05 UTC the day before in daylight saving
# and 23:05 UTC the day before otherwise (Mon/Wed/Sat UTC either way). Both are scheduled;
# the one that doesn't match today's offset stops straight away.
on:
  schedule:
    - cron: "5 22 * * 1,3,6"
    - cron: "5 23 * * 1,3,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (write nothing), test (TEST_EMAILS only), live (everyone), subjects (rewrite subject lines only)"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, test, live, subjects-dry-run, subjects]
      test_as:
        description: "Test mode only: email of the buyer whose picks you want to receive (blank = most active buyer)"
        required: false
        default: ""

# Never run two at once: a second run waits for the first, so the no-repeat history is always up to date.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only run on the 9:05am Sydney schedule
        id: gate
        run: |
          # Sydney is UTC+11 in daylight saving and UTC+10 otherwise.
          # Pick the schedule that matches today's offset; this still works if GitHub starts the run late.
          if [ "$(TZ=Australia/Sydney date +%z)" = "+1100" ]; then want="5 22 * * 1,3,6"; else want="5 23 * * 1,3,6"; fi
          now=$((10#$(TZ=Australia/Sydney date +%H%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$want" ]; then
            echo "This schedule is for the other half of the year - skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ $now -ge 1145 ]; then
            # Too close to the 12:05pm send: HubSpot's "delay until 12:05" would hold these contacts
            # until tomorrow and send stale picks. Skip today instead.
            echo "GitHub started this run late ($now Sydney) - skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Update HubSpot
        if: steps.gate.outputs.go == 'true'
        env:
          # Manual runs use the mode picked in the Run workflow box; scheduled runs use the
          # repo variable MODE (set it to test first, then live once signed off).
          MODE: ${{ github.event.inputs.mode || vars.MODE || 'dry-run' }}
          METABASE_URL: https://reporting.motorplatform.com.au
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          PICKS_QUESTION_ID: "270"
          ENDING_QUESTION_ID: ${{ vars.ENDING_QUESTION_ID }}
          TEMPLATE_PATH: ${{ vars.TEMPLATE_PATH || 'motormarket-daily-picks.html' }}
          TEST_EMAILS: ${{ vars.TEST_EMAILS }}
          TEST_AS: ${{ github.event.inputs.test_as }}
          COUNTDOWN_URL: ${{ vars.COUNTDOWN_URL }}
          ENDING_COUNTDOWN_URL: ${{ vars.ENDING_COUNTDOWN_URL }}
          MIN_BUYERS: "20"
        run: python daily_picks.py

name: Daily picks

# Started at 9:05am Sydney on Sunday, Tuesday and Wednesday by a cron-job.org job that calls the
# workflow_dispatch API with mode=live (GitHub's own schedule ran 3-6 hours late, so it isn't used).
# HubSpot sends the email at 12:05pm for the next closing day (Mon, Wed, Thu).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (write nothing), test (TEST_EMAILS only), live (everyone), subjects (rewrite subject lines only)"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, test, live, subjects-dry-run, subjects]
      test_as:
        description: "Test mode only: email of the buyer whose picks you want to receive (blank = most active buyer)"
        required: false
        default: ""

# Never run two at once: a second run waits for the first, so the no-repeat history is always up to date.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Update HubSpot
        env:
          # Mode comes from the dispatch input (cron-job.org sends live; the Run workflow box
          # defaults to dry-run). Falls back to the repo variable MODE.
          MODE: ${{ github.event.inputs.mode || vars.MODE || 'dry-run' }}
          METABASE_URL: https://reporting.motorplatform.com.au
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          PICKS_QUESTION_ID: "270"
          ENDING_QUESTION_ID: ${{ vars.ENDING_QUESTION_ID }}
          TEMPLATE_PATH: ${{ vars.TEMPLATE_PATH || 'motormarket-daily-picks.html' }}
          TEST_EMAILS: ${{ vars.TEST_EMAILS }}
          TEST_AS: ${{ github.event.inputs.test_as }}
          COUNTDOWN_URL: ${{ vars.COUNTDOWN_URL }}
          ENDING_COUNTDOWN_URL: ${{ vars.ENDING_COUNTDOWN_URL }}
          MIN_BUYERS: "20"
        run: python daily_picks.py
